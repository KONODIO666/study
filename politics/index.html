<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="政治抽问">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>政治抽问</title>
<style>
:root{
  --bg:#0f1115; --bg2:#15181f; --card:#1a1d24; --card2:#20242d;
  --line:#2a2f3a; --tx:#e8eaed; --tx2:#9aa0a6; --tx3:#6b7280;
  --red:#e0453a; --red2:#ff6b5e; --green:#34c759; --green2:#7ee2a8;
  --amber:#ff9f0a; --blue:#4a9eff;
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx); overflow-x:hidden;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--sat)}

/* ---------- 顶栏 ---------- */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg);
}
.title{font-size:17px;font-weight:700;letter-spacing:.5px}
.title small{font-weight:400;color:var(--tx3);font-size:12px;margin-left:6px;letter-spacing:0}
.spacer{flex:1}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--tx);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;
}
.chip:active{background:var(--card2)}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:17px;display:flex;
  align-items:center;justify-content:center;
}
.iconbtn:active{background:var(--card2)}

/* ---------- 进度条 ---------- */
.bar{flex:0 0 auto;height:3px;background:var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));width:0;transition:width .25s}

/* ---------- 主区 ---------- */
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 16px;min-height:210px;
}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;color:var(--tx2);background:var(--card2);border-radius:7px;padding:3px 9px}
.tag.p1{color:#ffb4a8;background:rgba(224,69,58,.16)}
.tag.p2{color:#ffd9a0;background:rgba(255,159,10,.15)}
.tag.p3{color:#a8d5ff;background:rgba(74,158,255,.15)}
.tag.p4{color:#b8f0c9;background:rgba(52,199,89,.15)}
.tag.p5{color:#dcc4ff;background:rgba(150,110,255,.16)}
.num{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.stars{margin-left:auto;display:flex;gap:6px;align-items:center}
.star{font-size:16px;opacity:.35}
.star.on{opacity:1}

.stem{font-size:19px;line-height:1.85;letter-spacing:.2px;word-break:break-word}
.filled{color:var(--green2);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.opt{background:#232733;border:1.5px solid #333a47;color:var(--tx);border-radius:12px;padding:12px 10px;
  font-size:15px;line-height:1.45;font-family:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.985)}
.opt.right{background:rgba(52,199,89,.18);border-color:var(--green);color:var(--green2)}
.opt.wrong{background:rgba(224,69,58,.18);border-color:var(--red);color:#ff8a80}
.opt.dim{opacity:.45}
.opts.jd .opt{font-size:19px;font-weight:700;padding:22px 0;letter-spacing:1px}
.stem.rev{font-size:21px;font-weight:600;color:var(--green2)}
.blank{
  display:inline-block;width:4.6em;padding:1px 6px;margin:0 2px;text-align:center;
  border-bottom:2px solid var(--red);color:var(--red2);font-weight:700;
  border-radius:6px 6px 0 0;vertical-align:baseline;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blank.on{
  display:inline;width:auto;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;
  border-bottom:none;padding:1px 3px;color:var(--green2);font-weight:700;
  background:rgba(52,199,89,.14);border-radius:4px;cursor:default;
}
.blank.hint{
  color:var(--amber);border-bottom-color:var(--amber);border-bottom-style:dashed;
  white-space:normal;overflow:visible;text-overflow:clip;cursor:pointer;
}
.plain-note{
  margin-top:14px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6;
  color:var(--tx2);background:var(--card2);border:1px dashed var(--line);
}
.reveal-tip{margin-top:14px;font-size:13px;color:var(--tx3);text-align:center}
.legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.legend b{
  font-weight:600;color:var(--green2);background:rgba(52,199,89,.1);
  border:1px solid rgba(52,199,89,.25);border-radius:8px;padding:2px 8px;font-size:13px;
}
.legend b i{color:var(--tx3);font-style:normal;font-size:11px;margin-right:4px}

/* ---------- 底部按钮 ---------- */
footer{
  flex:0 0 auto;padding:10px 14px calc(10px + var(--sab));
  border-top:1px solid var(--line);background:var(--bg);
  display:flex;gap:10px;align-items:center;
}
.btn{
  flex:1;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);font-size:16px;font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;color:#fff}
.btn.ok{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.4);color:var(--green2)}
.btn.no{background:rgba(224,69,58,.14);border-color:rgba(224,69,58,.38);color:#ffb4a8}
.btn.easy{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.42);color:#8ec5ff}
.btn small{display:block;font-size:10px;font-weight:400;opacity:.72;margin-top:1px;letter-spacing:.2px}
.btn.sm{flex:0 0 auto;width:64px;font-size:15px;font-weight:600;color:var(--tx2)}

/* ---------- 抽屉 / 面板 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:40;backdrop-filter:blur(2px);
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;overflow-y:auto;
  background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:14px 16px calc(20px + var(--sab));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.shd{
  position:sticky;top:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  margin:-14px -16px 6px;padding:14px 16px 10px;
  background:var(--bg2);border-radius:22px 22px 0 0;
}
.shd span{font-size:16px;font-weight:600;color:var(--tx)}
.shd button{
  border:none;background:rgba(255,255,255,.09);color:var(--tx);
  font-size:14px;font-weight:600;padding:7px 16px;border-radius:10px;
}
.shd button:active{background:rgba(255,255,255,.18);transform:scale(.97)}
.sheet h3{margin:6px 0 10px;font-size:15px;color:var(--tx2);font-weight:600}
.sheet h3:first-child{margin-top:0}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1 1 40%;min-height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx2);font-size:14px;font-weight:600;padding:6px 10px;
}
.seg button.on{background:rgba(224,69,58,.16);border-color:var(--red);color:#ffb4a8}
.seg button:active{transform:scale(.98)}
.rowbtns{display:flex;gap:10px;margin-top:6px}
.rowbtns .btn{height:46px;font-size:15px}

/* ---------- 统计 ---------- */
.stat{margin-top:4px}
.stat .line{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.stat .line span:first-child{flex:0 0 92px;color:var(--tx2)}
.stat .track{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
.stat .track>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));width:0}
.stat .line b{flex:0 0 62px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2);font-weight:600;font-size:13px}
.bigstat{display:flex;gap:10px;margin:8px 0 14px}
.bigstat div{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px;text-align:center;
}
.bigstat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.bigstat small{color:var(--tx3);font-size:12px}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.7;margin-top:10px}
.daily{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(224,69,58,.16),rgba(150,110,255,.12));
  border:1px solid rgba(224,69,58,.35);border-radius:14px;
  padding:10px 13px;margin-bottom:12px;font-size:14px;
}
.daily.ok{background:rgba(52,199,89,.12);border-color:rgba(52,199,89,.35)}
.daily b{color:#ffb4a8;font-weight:700}
.daily .go{
  margin-left:auto;background:var(--red);color:#fff;border-radius:10px;
  padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;
}
.daily.ok .go{background:rgba(52,199,89,.9)}
.daily .dtag{
  background:rgba(255,255,255,.09);border-radius:7px;padding:2px 7px;
  font-size:12px;color:var(--tx2);white-space:nowrap;
}
.slabel{font-size:12.5px;color:var(--tx2);margin:14px 0 6px;letter-spacing:.3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06)}
.heat i.h1{background:rgba(224,69,58,.32)}
.heat i.h2{background:rgba(224,69,58,.56)}
.heat i.h3{background:rgba(224,69,58,.8)}
.heat i.h4{background:var(--red)}
.fc{display:flex;align-items:flex-end;gap:6px;height:96px;padding:6px 2px 0}
.fcb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.fcb b{font-size:11px;color:var(--tx2);line-height:1.3;font-weight:600}
.fcb i{display:block;width:100%;min-height:2px;background:linear-gradient(180deg,var(--red),#7a1a14);border-radius:4px 4px 0 0}
.fcb.today i{background:linear-gradient(180deg,#ff8a7a,var(--red))}
.fcb small{font-size:10px;color:var(--tx3);margin-top:4px;white-space:nowrap}
.dueline{
  margin-top:12px;padding-top:11px;border-top:1px dashed rgba(255,255,255,.09);
  font-size:12.5px;color:var(--tx2);display:flex;justify-content:space-between;gap:8px;
}
.dueline b{color:var(--amber);font-weight:600}
.dueline .st{color:var(--amber);letter-spacing:1px}
.empty{text-align:center;color:var(--tx3);padding:60px 20px;font-size:15px;line-height:1.9}
.io{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(0,0,0,.74);
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);
}
.io.on{display:flex;align-items:center;justify-content:center}
.iobox{
  width:100%;max-width:560px;max-height:100%;background:#1a1d24;border-radius:18px;
  padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid #262a33;
}
.iohd{display:flex;align-items:center;justify-content:space-between;flex:none}
.iohd b{font-size:16px}
.iohd button{
  background:rgba(255,255,255,.09);border:0;color:var(--tx);border-radius:9px;
  padding:6px 13px;font-size:13px;font-family:inherit;
}
.iohint{font-size:12.5px;color:var(--tx2);line-height:1.6;flex:none}
#ioText{
  flex:1;min-height:150px;max-height:50vh;width:100%;resize:none;box-sizing:border-box;
  background:#0c0e12;color:var(--tx);border:1px solid #262a33;border-radius:11px;padding:10px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">政治抽问<small id="hdrSub"></small></div>
    <div class="spacer"></div>
    <button class="chip" id="btnStar">☆</button>
    <button class="iconbtn" id="btnSet">⚙</button>
  </header>
  <div class="bar"><i id="barFill"></i></div>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<div class="mask" id="mask"></div>

<div class="sheet" id="sheet">
  <div class="shd">
    <span>设置</span>
    <button id="btnBack">返回</button>
  </div>
  <div class="grabber"></div>
  <h3>抽哪些板块</h3>
  <div class="seg" id="segParts"></div>
  <h3>抽哪一批</h3>
  <div class="seg" id="segScope">
    <button data-v="today">今日任务</button>
    <button data-v="all">全部随机</button>
    <button data-v="todo">只抽没掌握的</button>
    <button data-v="weak">只抽错过的</button>
    <button data-v="star">只抽错题本</button>
  </div>
  <h3>出题方式</h3>
  <div class="seg" id="segMode">
    <button data-v="cloze">挖空背诵</button>
    <button data-v="reverse">反向抽问</button>
    <button data-v="choice">选词填空</button>
    <button data-v="judge">判断题</button>
    <button data-v="mix">混合随机</button>
  </div>
  <h3>每天新学几道</h3>
  <div class="seg" id="segNew">
    <button data-v="10">10 道</button>
    <button data-v="20">20 道</button>
    <button data-v="30">30 道</button>
    <button data-v="999">不限</button>
  </div>
  <h3>我的进度</h3>
  <div class="bigstat" id="bigstat"></div>
  <div class="stat" id="statBox"></div>
  <div class="forecast" id="forecastBox"></div>
  <div class="rowbtns">
    <button class="btn sm" style="width:auto;flex:1" id="btnExport">导出进度</button>
    <button class="btn sm" style="width:auto;flex:1" id="btnImport">导入进度</button>
  </div>
  <div class="rowbtns">
    <button class="btn sm" style="width:auto;flex:1" id="btnReset">清空全部进度</button>
    <button class="btn primary" style="flex:2" id="btnClose">开始抽问</button>
  </div>
  <div class="hint" id="hintBox"></div>
</div>

<div class="io" id="io">
  <div class="iobox">
    <div class="iohd"><b id="ioTitle">导出进度</b><button id="ioX">关闭</button></div>
    <div class="iohint" id="ioHint"></div>
    <textarea id="ioText" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
    <div class="rowbtns">
      <button class="btn primary" style="flex:1" id="ioDo">复制</button>
    </div>
  </div>
</div>

const PARTS = ["马原", "毛中特·习思想", "史纲", "思想道德与法治", "形势与政策"];
const PARTCLS = {"马原": "p1", "毛中特·习思想": "p2", "史纲": "p3", "思想道德与法治": "p4", "形势与政策": "p5"};
const KEY = "zz_state_v1";
const APPVER = "2026-10-15 · v13";

/* ============================================================
   状态
   ============================================================ */
function defCfg() {
  return { parts: PARTS.slice(), scope: "today", mode: "cloze", newPerDay: 20 };
}
let cfg = defCfg();
let st = {};          // { id: {ok:连对次数, bad:累计错, star:bool, seen:n} }
let pool = [];
let idx = 0;
let revealed = {};    // 当前题已揭示的空
let hinted = {};      // 当前题已给过提示的空
let curMode = "cloze";
let swapped = false;  // 反向模式：是否已看原题
let choiceState = null; // 选词填空：{k, right, opts, picked}
let judgeState = null;  // 判断题：{picked: "对"|"错"|null}
let stat = { done: 0, ok: 0, bad: 0, lastDay: "", streak: 0, history: {} };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.cfg) {
      cfg = Object.assign(defCfg(), o.cfg);
      if (!Array.isArray(cfg.parts) || !cfg.parts.length) cfg.parts = PARTS.slice();
    }
    if (o && o.st) st = o.st;
    if (o && o.stat) stat = Object.assign(stat, o.stat);
    migrateLegacy();
  } catch (e) { }
}
/* 题库的 id 体系换过：老版本按 1、2、3… 编号，现在改成按内容算出来的短码。
   这里把老编号底下的做题记录搬到新 id 上，只搬一次。 */
function migrateLegacy() {
  let moved = 0;
  for (let i = 0; i < Q.length; i++) {
    const q = Q[i];
    if (!q.legacy) continue;
    const old = st[q.legacy];
    if (!old) continue;
    if (!st[q.id]) {
      st[q.id] = old;
    } else {
      const s = st[q.id];
      s.ok = Math.max(s.ok || 0, old.ok || 0);
      s.bad = (s.bad || 0) + (old.bad || 0);
      s.star = !!s.star || !!old.star;
      s.seen = Math.max(s.seen || 0, old.seen || 0);
      if (old.due && (!s.due || old.due < s.due)) s.due = old.due;
      s.ivl = Math.max(s.ivl || 0, old.ivl || 0);
      s.reps = Math.max(s.reps || 0, old.reps || 0);
      if (old.ef != null) s.ef = Math.min(s.ef == null ? 2.5 : s.ef, old.ef);
    }
    delete st[q.legacy];
    moved++;
  }
  if (moved) save();
  return moved;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ cfg: cfg, st: st, stat: stat, v: 1 })); } catch (e) { }
}
function S(id) {
  let s = st[id];
  if (!s) return (st[id] = { ok: 0, bad: 0, star: false, seen: 0, ef: 2.5, ivl: 0, reps: 0, due: "" });
  if (s.ef == null) s.ef = 2.5;
  if (s.ivl == null) s.ivl = 0;
  if (s.reps == null) s.reps = 0;
  if (s.due == null) s.due = "";
  return s;
}
function mastered(id) { const s = st[id]; return !!s && s.ok >= 2; }

/* ============================================================
   工具
   ============================================================ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---------- 间隔重复调度（SM-2 简化版） ----------
   ef  = 难度因子，初始 2.5，越低说明这题对你越难
   ivl = 当前间隔（天）；reps = 连续答对次数；due = 下次该复习的日期
   SRS_STEPS 是前几次答对后走的固定间隔，之后按 ef 增长 */
const EF_MIN = 1.3;
const MAX_IVL = 30;                       // 考试场景：间隔最长 30 天
const SRS_STEPS = [1, 3, 8, 20, 50];

function isNew(id) { const s = st[id]; return !s || !s.seen; }

function dueToday(id) {
  const s = st[id];
  if (!s || !s.seen) return false;
  return !s.due || s.due <= dayStr(0);
}

/* 已经逾期几天（没逾期返回 0） */
function dueDelay(s) {
  if (!s.due) return 0;
  const a = new Date(s.due + "T00:00:00").getTime();
  const b = new Date(dayStr(0) + "T00:00:00").getTime();
  return Math.max(0, Math.round((b - a) / 86400000));
}

/* 间隔 → 掌握度星级，给用户看的"人话" */
function masteryStars(i) {
  if (!i || i <= 0) return 0;
  if (i <= 1) return 1;
  if (i <= 3) return 2;
  if (i <= 10) return 3;
  if (i <= 21) return 4;
  return 5;
}

function starsHTML(n) {
  let s = "";
  for (let i = 0; i < 5; i++) s += i < n ? "★" : "☆";
  return '<span class="st">' + s + "</span>";
}

function dueLineHTML(q) {
  const s = S(q.id);
  if (!s.seen) return '<div class="dueline"><span>第一次见 · 答对后 <b>1 天</b>再考你</span><span>难度 2.5</span></div>';
  const d = dueDelay(s);
  let when;
  if (!s.due) when = "今天还会考你";
  else if (s.due <= dayStr(0)) when = d > 0 ? ("已经逾期 <b>" + d + " 天</b>，今天就该复习") : "就是<b>今天</b>要复习的";
  else when = "下次复习：<b>" + s.ivl + " 天后</b>";
  return '<div class="dueline"><span>' + when + "</span><span>" + starsHTML(masteryStars(s.ivl)) + " 难度 " + s.ef.toFixed(2) + "</span></div>";
}

/* grade: 0=没记住, 1=记住了, 2=太简单 */
function srsUpdate(s, grade) {
  const base = Math.max(1, s.ivl || 1);
  const delay = dueDelay(s);
  if (!grade) {
    s.reps = 0;
    /* 复习过的题：保留两成间隔，别打回原形；新题第一次答错不扣难度因子 */
    s.ivl = s.seen > 1 ? Math.max(1, Math.round(base * 0.2)) : 1;
    if (s.seen > 1) s.ef = Math.max(EF_MIN, s.ef - 0.2);
    s.due = dayStr(s.ivl);
    return;
  }
  let next;
  if (grade === 2) {
    /* 太简单：跳过固定台阶，直接按难度因子放大 */
    next = Math.round(base * s.ef * 1.3);
    s.ef = Math.min(3.0, s.ef + 0.1);
  } else if (s.reps < SRS_STEPS.length) {
    next = SRS_STEPS[s.reps];
  } else {
    next = Math.round(base * s.ef);
  }
  if (delay > 0) next += Math.round(delay * 0.5);      // 逾期补偿：隔久了答对，下次可以更晚
  next = Math.max(next, base + 1);                      // 答对了就绝不缩短间隔
  next = Math.min(next, MAX_IVL);
  s.reps++;
  s.ivl = next;
  s.due = dayStr(next);
}

/* 按钮上预告"下次几天后再见"，不改真实状态 */
function ivlLabel(s, grade) {
  const c = { ivl: s.ivl || 0, ef: s.ef || 2.5, reps: s.reps || 0, seen: s.seen || 1, due: s.due || "" };
  srsUpdate(c, grade);
  return c.ivl + " 天";
}

/* ---------- 每日打卡 ---------- */
function dayStr(off) {
  const d = new Date();
  if (off) d.setDate(d.getDate() + off);
  const p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function touchDay() {
  const today = dayStr(0);
  if (stat.lastDay === today) return;
  stat.streak = (stat.lastDay === dayStr(-1)) ? ((stat.streak || 0) + 1) : 1;
  stat.lastDay = today;
}

function todayCount() {
  const cand = Q.filter(function (x) { return cfg.parts.indexOf(x.part) >= 0; });
  const due = cand.filter(function (x) { return dueToday(x.id); }).length;
  const fresh = cand.filter(function (x) { return isNew(x.id); }).length;
  const lim = (cfg.newPerDay == null ? 20 : cfg.newPerDay);
  return { due: due, fresh: fresh, take: Math.min(fresh, lim), todo: due + Math.min(fresh, lim) };
}

function dailyHTML() {
  const c = todayCount();
  const n = stat.streak || 0;
  const doneToday = stat.lastDay === dayStr(0);
  if (!c.todo) {
    return '<div class="daily ok">🎉 今天的量已经刷完了' +
      (n ? " · 连续 " + n + " 天" : "") +
      '<span class="go" id="dGo">随便刷刷</span></div>';
  }
  return '<div class="daily' + (doneToday ? " ok" : "") + '">' +
    (doneToday ? "✅ 今天练过了 · " : "<b>今日任务</b> · ") +
    '<span class="dtag">复习 ' + c.due + "</span>" +
    '<span class="dtag">新学 ' + c.take + "</span>" +
    '<span class="dtag">约 ' + Math.max(1, Math.round(c.todo * 18 / 60)) + " 分钟</span>" +
    (n ? " · 连续 " + n + " 天" : "") +
    '<span class="go" id="dGo">' + (doneToday ? "再练一组" : "开始 →") + "</span></div>";
}

function startTodo() {
  cfg.scope = "today";
  pool = buildPool();
  save();
  if (!pool.length) { renderEmpty(); return; }
  goTo(0);
}
function blankLen(ans) { return "&nbsp;"; }

/* 提示：只露前两个字，够想起就行 */
function hintText(ans) {
  const s = String(ans == null ? "" : ans);
  if (s.length <= 2) return s;
  return s.slice(0, 2) + "…";
}

/* ============================================================
   组卷
   ============================================================ */
/* 出题方式选了「判断题」时，题池里只留判断题 */
function kindOK(x) {
  return cfg.mode !== "judge" || x.kind === "judge";
}

function buildTodo() {
  const cand = Q.filter(function (x) { return cfg.parts.indexOf(x.part) >= 0 && kindOK(x); });
  const due = shuffle(cand.filter(function (x) { return dueToday(x.id); }));
  const fresh = shuffle(cand.filter(function (x) { return isNew(x.id); }));
  const lim = (cfg.newPerDay == null ? 20 : cfg.newPerDay);
  return due.concat(fresh.slice(0, lim));
}

function buildPool() {
  if (cfg.scope === "today") return buildTodo();
  let arr = Q.filter(function (x) { return cfg.parts.indexOf(x.part) >= 0 && kindOK(x); });
  if (cfg.scope === "todo") arr = arr.filter(function (x) { return !mastered(x.id); });
  else if (cfg.scope === "weak") arr = arr.filter(function (x) { const s = st[x.id]; return s && s.bad > 0 && !mastered(x.id); });
  else if (cfg.scope === "star") arr = arr.filter(function (x) { const s = st[x.id]; return s && s.star; });
  return shuffle(arr.slice());
}

function pickMode(q) {
  if (q.kind === "judge") return "judge";     // 判断题只有这一种考法
  if (cfg.mode === "mix") {
    if (!q.answers || !q.answers.length) return Math.random() < 0.5 ? "cloze" : "reverse";
    /* 按熟练度升难度：没对过给选项 → 对过挖空 → 熟了反向想题 */
    const s = st[q.id];
    const ok = (!s || !s.seen) ? 0 : (s.ok || 0);
    if (ok <= 0) return "choice";
    if (ok <= 2) return "cloze";
    return "reverse";
  }
  if ((cfg.mode === "reverse" || cfg.mode === "choice") && (!q.answers || !q.answers.length)) return "cloze";
  return cfg.mode;
}

/* ============================================================
   渲染
   ============================================================ */
const $main = document.getElementById("main");
const $foot = document.getElementById("footer");

function goTo(n) {
  if (!pool.length) { render(); return; }
  const len = pool.length;
  idx = ((n % len) + len) % len;
  revealed = {};
  hinted = {};
  swapped = false;
  choiceState = null;
  judgeState = null;
  curMode = pickMode(pool[idx]);
  render();
}

function render() {
  if (!pool.length) { renderEmpty(); return; }
  if (idx >= pool.length) idx = 0;
  const q = pool[idx];
  if (curMode !== "reverse" && curMode !== "cloze" && curMode !== "choice" && curMode !== "judge") curMode = "cloze";

  const total = pool.length;
  document.getElementById("barFill").style.width = ((idx + 1) / total * 100) + "%";
  document.getElementById("hdrSub").textContent = (idx + 1) + "/" + total + " · " + scopeName();
  document.getElementById("btnStar").textContent = S(q.id).star ? "★" : "☆";
  document.getElementById("btnStar").style.color = S(q.id).star ? "var(--amber)" : "var(--tx2)";

  let body = "";
  body += '<div class="meta">';
  const secShow = (curMode === "choice") ? "" : (q.section ? " · " + esc(q.section) : "");
  body += '<span class="tag ' + (PARTCLS[q.part] || "") + '">' + esc(q.part) + secShow + "</span>";
  body += '<span class="num">#' + q.id + "</span>";
  body += "</div>";

  if (curMode === "reverse" && q.answers && q.answers.length) {
    body += '<div class="stem rev">' + esc(q.answers.join("　/　")) + "</div>";
    body += '<div class="reveal-tip" id="tip">' + (swapped ? "" : "这是哪一条的答案？想好点「看原题」") + "</div>";
    if (swapped) {
      body += '<div class="legend" style="display:block;margin-top:14px">' + esc(q.raw) + "</div>";
    }
    if (q.answers.length > 1) {
      body += '<div class="reveal-tip">（这条有 ' + q.answers.length + " 个空）</div>";
    }
  } else if (curMode === "choice" && q.answers && q.answers.length) {
    if (!choiceState) choiceState = makeChoice(q);
    body += '<div class="stem" id="stem">' + choiceStem(q, choiceState.k) + "</div>";
    body += '<div class="opts" id="opts">';
    for (let i = 0; i < choiceState.opts.length; i++) {
      const t = choiceState.opts[i];
      let cls = "opt";
      if (choiceState.picked) {
        if (t === choiceState.right) cls += " right";
        else if (t === choiceState.picked) cls += " wrong";
        else cls += " dim";
      }
      body += '<button class="' + cls + '" data-opt="' + i + '">' + esc(t) + "</button>";
    }
    body += "</div>";
    if (choiceState.picked) {
      body += '<div class="reveal-tip">' +
        (choiceState.picked === choiceState.right ? "✅ 选对了" : "❌ 选错了，正确答案是上面绿色的那个") + "</div>";
    } else {
      body += '<div class="reveal-tip">从下面 4 个里选一个填进去</div>';
    }
  } else if (curMode === "judge") {
    if (!judgeState) judgeState = { picked: null };
    const right = q.answers[0];
    body += '<div class="stem" id="stem">' + esc(q.stem) + "</div>";
    body += '<div class="opts jd" id="opts">';
    ["对", "错"].forEach(function (v) {
      let cls = "opt";
      if (judgeState.picked) {
        if (v === right) cls += " right";
        else if (v === judgeState.picked) cls += " wrong";
        else cls += " dim";
      }
      body += '<button class="' + cls + '" data-jd="' + v + '">' + (v === "对" ? "√ 对" : "× 错") + "</button>";
    });
    body += "</div>";
    if (judgeState.picked) {
      const ok = judgeState.picked === right;
      body += '<div class="reveal-tip">' +
        (ok ? "✅ 判断正确" : "❌ 判断错了 —— 这句话是「" + right + "」的") + "</div>";
      if (q.src && q.src !== q.stem) {
        body += '<div class="legend" style="display:block;margin-top:12px">原文：' + esc(q.src) + "</div>";
      }
    } else {
      body += '<div class="reveal-tip">这句话是对的还是错的？</div>';
    }
  } else {
    body += '<div class="stem" id="stem">' + stemHTML(q) + "</div>";
    if (!q.answers || !q.answers.length) {
      body += '<div class="plain-note">这条是<b>整句记忆</b>：没有可挖的关键词，直接把它当一句话背下来。</div>';
    }
    body += '<div class="reveal-tip">点虚线处给个提示，再点一下看答案</div>';
  }

  const showDue = curMode === "reverse" ? swapped
    : curMode === "choice" ? !!(choiceState && choiceState.picked)
      : curMode === "judge" ? !!(judgeState && judgeState.picked)
        : Object.keys(revealed).length > 0;
  $main.innerHTML = dailyHTML() + '<div class="card">' + body +
    (showDue ? dueLineHTML(q) : "") + "</div>";
  const dgo = document.getElementById("dGo");
  if (dgo) dgo.onclick = startTodo;
  bindBlanks(q);
  bindOpts();
  renderFooter(q);
}

/* 给答案按“长相”分类：干扰项必须同型，否则一眼就能排除 */
function ansType(s) {
  s = String(s).trim();
  if (/^《/.test(s)) return "book";
  if (/\d{4}\s*年/.test(s)) return "year";
  if (/^[①②③④⑤⑥]/.test(s)) return "flow";
  if (/^\d+(\.\d+)?\s*(%|年|次|个|项|条|天|届)?$/.test(s)) return "num";
  if (s.length <= 6) return "term";
  return "phrase";
}

function makeChoice(q) {
  const k = Math.floor(Math.random() * q.answers.length);
  const right = String(q.answers[k]).trim();
  const rt = ansType(right);
  const R = right.length;
  const seen = {};
  const cand = [];
  for (let i = 0; i < Q.length; i++) {
    const o = Q[i];
    if (o.part !== q.part) continue;
    const sameSec = (q.section && o.section === q.section) ? 1 : 0;
    for (let j = 0; j < o.answers.length; j++) {
      const t = String(o.answers[j]).trim();
      if (!t || t === right || seen[t]) continue;
      if (t.indexOf(right) >= 0 || right.indexOf(t) >= 0) continue;
      if (ansType(t) !== rt) continue;
      const d = Math.abs(t.length - R);
      if (d > Math.max(4, Math.round(R * 0.55))) continue;
      seen[t] = 1;
      cand.push({ t: t, sc: sameSec * 6 - d * 1.5 + Math.random() * 2 });
    }
  }
  cand.sort(function (a, b) { return b.sc - a.sc; });
  const opts = [right];
  // 只在得分最高的前 10 个里挑，且每次随机 —— 既保证迷惑性，又不会每次都一样
  const pool = cand.slice(0, 10);
  while (opts.length < 4 && pool.length) {
    const i = Math.floor(Math.random() * pool.length);
    opts.push(pool[i].t);
    pool.splice(i, 1);
  }
  // 同型的实在不够，才放宽到“只要求长度接近”，保证至少 3 个选项
  if (opts.length < 3) {
    const loose = [];
    for (let i = 0; i < Q.length; i++) {
      const o = Q[i];
      if (o.part !== q.part) continue;
      for (let j = 0; j < o.answers.length; j++) {
        const t = String(o.answers[j]).trim();
        if (t && t !== right && t.length >= 2 && Math.abs(t.length - R) <= 3 && opts.indexOf(t) < 0 && loose.indexOf(t) < 0) loose.push(t);
      }
      if (loose.length >= 30) break;
    }
    while (opts.length < 4 && loose.length) {
      const i = Math.floor(Math.random() * loose.length);
      opts.push(loose[i]);
      loose.splice(i, 1);
    }
  }
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
  }
  return { k: k, right: right, opts: opts, picked: null };
}

function choiceStem(q, k) {
  let s = esc(q.stem);
  s = s.replace(/\{\{(\d+)\}\}/g, function (m, i) {
    const n = parseInt(i, 10);
    if (n === k) return '<span class="blank">&nbsp;</span>';
    return '<span class="filled">' + esc(q.answers[n] || "") + "</span>";
  });
  return s;
}

function bindOpts() {
  const box = document.getElementById("opts");
  if (!box) return;
  const btns = box.querySelectorAll(".opt");
  if (curMode === "judge") {
    if (!judgeState || judgeState.picked) return;
    for (let i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        pickJudge(this.getAttribute("data-jd"));
      });
    }
    return;
  }
  if (curMode !== "choice" || !choiceState || choiceState.picked) return;
  for (let i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      pickOpt(parseInt(this.getAttribute("data-opt"), 10));
    });
  }
}

/* 判断题：对 / 错，答对算「记住了」，答错算「没记住」，照样进错题本和复习计划 */
function pickJudge(v) {
  if (!judgeState || judgeState.picked) return;
  const q = pool[idx];
  judgeState.picked = v;
  applyMark(q, v === q.answers[0] ? 1 : 0);
  render();
}

function pickOpt(i) {
  if (!choiceState || choiceState.picked) return;
  const q = pool[idx];
  choiceState.picked = choiceState.opts[i];
  applyMark(q, choiceState.picked === choiceState.right);
  render();
}

function stemHTML(q) {
  let s = esc(q.stem);
  s = s.replace(/\{\{(\d+)\}\}/g, function (m, i) {
    const n = parseInt(i, 10);
    const ans = (q.answers && q.answers[n] != null) ? q.answers[n] : "";
    if (revealed[n]) return '<span class="blank on">' + esc(ans) + "</span>";
    if (hinted[n]) return '<span class="blank hint" data-i="' + n + '">' + esc(hintText(ans)) + "</span>";
    return '<span class="blank" data-i="' + n + '">' + blankLen(ans) + "</span>";
  });
  return s;
}

function bindBlanks(q) {
  const list = $main.querySelectorAll(".blank[data-i]");
  for (let i = 0; i < list.length; i++) {
    list[i].addEventListener("click", function () {
      const n = parseInt(this.getAttribute("data-i"), 10);
      const ans = q.answers[n];
      if (!hinted[n] && !revealed[n]) {      // 第一下只给提示（前两个字）
        hinted[n] = true;
        this.textContent = hintText(ans);
        this.className = "blank hint";
        return;
      }
      revealed[n] = true;
      this.textContent = ans;
      this.className = "blank on";
      if (Object.keys(revealed).length >= q.answers.length) renderFooter(q);
    });
  }
}

function renderFooter(q) {
  if (curMode === "choice" && q.answers && q.answers.length) {
    if (!choiceState || !choiceState.picked) {
      $foot.innerHTML =
        '<button class="btn sm" id="bSkip">跳过</button>' +
        '<button class="btn primary" id="bShow">不会，看答案</button>';
      document.getElementById("bShow").onclick = function () {
        if (choiceState) choiceState.picked = "\u0000";
        applyMark(q, 0);
        render();
      };
      document.getElementById("bSkip").onclick = skip;
    } else {
      $foot.innerHTML = '<button class="btn primary" id="bNext">下一题 →</button>';
      document.getElementById("bNext").onclick = next;
    }
    return;
  }

  if (curMode === "judge") {
    if (!judgeState || !judgeState.picked) {
      $foot.innerHTML =
        '<button class="btn sm" id="bSkip">跳过</button>' +
        '<button class="btn primary" id="bShow">不会，看答案</button>';
      document.getElementById("bShow").onclick = function () {
        judgeState.picked = "\u0000";
        applyMark(q, 0);
        render();
      };
      document.getElementById("bSkip").onclick = skip;
    } else {
      $foot.innerHTML = '<button class="btn primary" id="bNext">下一题 →</button>';
      document.getElementById("bNext").onclick = next;
    }
    return;
  }

  const anyReveal = curMode === "reverse" ? swapped : Object.keys(revealed).length > 0;
  const allReveal = curMode === "reverse" ? swapped : (q.answers && q.answers.length && Object.keys(revealed).length >= q.answers.length);

  if (!q.answers || !q.answers.length) {
    // 整句记忆：直接给判断按钮
    const s1 = S(q.id);
    $foot.innerHTML =
      '<button class="btn no" id="bNo">没记住<small>' + ivlLabel(s1, 0) + "</small></button>" +
      '<button class="btn ok" id="bOk">记住了<small>' + ivlLabel(s1, 1) + "</small></button>" +
      '<button class="btn easy" id="bEasy">太简单<small>' + ivlLabel(s1, 2) + "</small></button>";
    document.getElementById("bOk").onclick = function () { mark(1); };
    document.getElementById("bNo").onclick = function () { mark(0); };
    document.getElementById("bEasy").onclick = function () { mark(2); };
    return;
  }

  if (!anyReveal) {
    $foot.innerHTML =
      '<button class="btn sm" id="bSkip">跳过</button>' +
      '<button class="btn primary" id="bShow">' + (curMode === "reverse" ? "看原题" : "看答案") + "</button>";
    document.getElementById("bShow").onclick = function () { revealAll(q); };
    document.getElementById("bSkip").onclick = function () { skip(); };
    return;
  }

  const s2 = S(q.id);
  $foot.innerHTML =
    '<button class="btn no" id="bNo">没记住<small>' + ivlLabel(s2, 0) + "</small></button>" +
    (allReveal ? "" : '<button class="btn sm" id="bMore">全看</button>') +
    '<button class="btn ok" id="bOk">记住了<small>' + ivlLabel(s2, 1) + "</small></button>" +
    '<button class="btn easy" id="bEasy">太简单<small>' + ivlLabel(s2, 2) + "</small></button>";
  document.getElementById("bOk").onclick = function () { mark(1); };
  document.getElementById("bNo").onclick = function () { mark(0); };
  document.getElementById("bEasy").onclick = function () { mark(2); };
  const more = document.getElementById("bMore");
  if (more) more.onclick = function () { revealAll(q); };
}

function revealAll(q) {
  if (curMode === "reverse") { swapped = true; render(); return; }
  if (curMode === "choice") { if (choiceState) choiceState.picked = "\u0000"; render(); return; }
  if (curMode === "judge") { if (judgeState) judgeState.picked = "\u0000"; render(); return; }
  if (q.answers) for (let i = 0; i < q.answers.length; i++) revealed[i] = true;
  render();
}

function renderEmpty() {
  document.getElementById("barFill").style.width = "0%";
  document.getElementById("hdrSub").textContent = "";
  $main.innerHTML = dailyHTML() + '<div class="empty">这一批已经抽完啦 🎉<br><br>去 ⚙ 里换个范围，或者<br>清空进度重新来一轮。</div>';
  const dgo2 = document.getElementById("dGo");
  if (dgo2) dgo2.onclick = startTodo;
  $foot.innerHTML = '<button class="btn primary" id="bSet">打开设置</button>';
  document.getElementById("bSet").onclick = openSheet;
}

function scopeName() {
  const m = { today: "今日任务", all: "全部随机", todo: "只抽没掌握的", weak: "只抽错过的", star: "只抽错题本" };
  return m[cfg.scope] || "";
}

function heatHTML() {
  const H = stat.history || {};
  const cells = [];
  for (let i = 55; i >= 0; i--) {
    const d = dayStr(-i);
    const n = H[d] || 0;
    let lv = 0;
    if (n > 0) lv = 1;
    if (n >= 10) lv = 2;
    if (n >= 25) lv = 3;
    if (n >= 50) lv = 4;
    cells.push('<i class="h' + lv + '" title="' + d + " · " + n + ' 道"></i>');
  }
  return '<div class="heat">' + cells.join("") + "</div>";
}

function forecastHTML() {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = dayStr(i);
    const n = Q.filter(function (x) {
      const s = st[x.id];
      if (!s || !s.seen || !s.due) return false;
      if (cfg.parts.indexOf(x.part) < 0) return false;
      return i === 0 ? (s.due <= d) : (s.due === d);
    }).length;
    days.push({ d: d.slice(5), n: n, i: i });
  }
  const max = Math.max(1, Math.max.apply(null, days.map(function (x) { return x.n; })));
  const lab = ["今天", "明天", "后天"];
  return '<div class="fc">' + days.map(function (x) {
    const h = Math.round(x.n / max * 100);
    return '<div class="fcb' + (x.i === 0 ? " today" : "") + '"><b>' + (x.n || "·") + "</b>" +
      '<i style="height:' + h + '%"></i>' +
      "<small>" + (lab[x.i] || x.d) + "</small></div>";
  }).join("") + "</div>";
}

/* ============================================================
   答题
   ============================================================ */
function applyMark(q, grade) {
  touchDay();
  const good = grade > 0;
  const s = S(q.id);
  s.seen++;
  srsUpdate(s, grade);
  if (good) {
    const times = (grade === 2) ? 2 : 1;    // 「太简单」算两次，升级更快
    for (let i = 0; i < times; i++) s.ok++;
    if (s.ok >= 2) s.star = false;
  } else { s.ok = 0; s.bad++; s.star = true; }
  stat.done++; if (good) stat.ok++; else stat.bad++;
  if (!stat.history) stat.history = {};
  const dkey = dayStr(0);
  stat.history[dkey] = (stat.history[dkey] || 0) + 1;
  save();
}

function mark(grade) {
  applyMark(pool[idx], grade);
  next();
}

function skip() {
  next();
}

function next() {
  if (!pool.length) { render(); return; }
  const n = idx + 1;
  if (n < pool.length) { goTo(n); return; }
  if (cfg.scope !== "all") {
    // 非「全部随机」：抽完一轮就重算题池（刚标记成掌握的会被剔除）
    pool = buildPool();
    if (!pool.length) { renderEmpty(); return; }
    goTo(0);
    return;
  }
  goTo(0);
}

/* ============================================================
   设置面板
   ============================================================ */
const $sheet = document.getElementById("sheet");
const $mask = document.getElementById("mask");

function openSheet() {
  renderSheet();
  $sheet.classList.add("on");
  $mask.classList.add("on");
}
function closeSheet() {
  $sheet.classList.remove("on");
  $mask.classList.remove("on");
  pool = buildPool(); save(); goTo(0);
}
$mask.onclick = closeSheet;
document.getElementById("btnSet").onclick = openSheet;
document.getElementById("btnClose").onclick = closeSheet;
document.getElementById("btnBack").onclick = closeSheet;
document.getElementById("btnReset").onclick = function () {
  if (!confirm("清空全部做题进度？题目本身不会丢，只是标记和统计归零。")) return;
  st = {}; stat = { done: 0, ok: 0, bad: 0, lastDay: "", streak: 0 };
  save(); renderSheet();
};
document.getElementById("btnExport").onclick = showExport;
document.getElementById("btnImport").onclick = showImport;
document.getElementById("btnStar").onclick = function () {
  if (!pool.length) return;
  const q = pool[idx];
  const s = S(q.id);
  s.star = !s.star;
  save();
  document.getElementById("btnStar").textContent = s.star ? "★" : "☆";
  document.getElementById("btnStar").style.color = s.star ? "var(--amber)" : "var(--tx2)";
};

/* ============================================================
   进度导出 / 导入
   ============================================================ */
const PROG_BASE = Date.UTC(2020, 0, 1);
const PROG_DAY = 86400000;

function cfgArr() { return cfg.parts || cfg.lists || []; }
function setCfgArr(v) { if (cfg.parts) cfg.parts = v; else cfg.lists = v; }

function exportText() {
  const L = [];
  L.push("ZZ1");
  L.push([stat.streak | 0, stat.lastDay || "", stat.done | 0, stat.ok | 0, stat.bad | 0].join(","));
  const H = stat.history || {};
  L.push(Object.keys(H).sort().map(function (k) { return k + ":" + H[k]; }).join(","));
  L.push([cfg.scope, cfg.mode, cfg.newPerDay == null ? "" : cfg.newPerDay].join(","));
  L.push(cfgArr().join("|"));
  Object.keys(st).forEach(function (id) {
    const s = st[id];
    if (!s || !s.seen) return;
    let d = 0;
    if (s.due) {
      const t = Date.parse(s.due + "T00:00:00Z");
      if (!isNaN(t)) d = Math.round((t - PROG_BASE) / PROG_DAY);
    }
    L.push([id, s.ok | 0, s.bad | 0, s.star ? 1 : 0, s.seen | 0,
            Math.round((s.ef || 2.5) * 10), s.ivl | 0, s.reps | 0, d].join(","));
  });
  return L.join("\n");
}

function importText(txt) {
  const lines = String(txt || "").replace(/\r/g, "").split("\n");
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (!lines[i] || lines[i].trim() !== "ZZ1") throw new Error("这串码不像本 App 导出的进度");
  i++;
  const a = (lines[i++] || "").split(",");
  stat.streak = parseInt(a[0], 10) || 0;
  stat.lastDay = a[1] || "";
  stat.done = parseInt(a[2], 10) || 0;
  stat.ok = parseInt(a[3], 10) || 0;
  stat.bad = parseInt(a[4], 10) || 0;
  stat.history = {};
  (lines[i++] || "").split(",").forEach(function (kv) {
    const p = kv.split(":");
    if (p.length === 2 && p[0]) stat.history[p[0]] = parseInt(p[1], 10) || 0;
  });
  const c = (lines[i++] || "").split(",");
  if (c[0]) cfg.scope = c[0];
  if (c[1]) cfg.mode = c[1];
  if (c[2]) cfg.newPerDay = parseInt(c[2], 10) || cfg.newPerDay;
  const ps = (lines[i++] || "").split("|").filter(Boolean);
  if (ps.length) setCfgArr(ps);
  let n = 0, merged = 0;
  for (; i < lines.length; i++) {
    const f = lines[i].split(",");
    if (f.length < 9 || !f[0]) continue;
    let due = "";
    const dd = parseInt(f[8], 10);
    if (dd > 0) due = new Date(PROG_BASE + dd * PROG_DAY).toISOString().slice(0, 10);
    const inc = {
      ok: parseInt(f[1], 10) || 0, bad: parseInt(f[2], 10) || 0,
      star: f[3] === "1", seen: parseInt(f[4], 10) || 0,
      ef: (parseInt(f[5], 10) || 25) / 10, ivl: parseInt(f[6], 10) || 0,
      reps: parseInt(f[7], 10) || 0, due: due
    };
    const cur = st[f[0]];
    if (cur && cur.seen) {
      merged++;
      cur.ok = Math.max(cur.ok || 0, inc.ok);
      cur.bad = (cur.bad || 0) + inc.bad;
      cur.star = !!(cur.star || inc.star);
      cur.seen = Math.max(cur.seen || 0, inc.seen);
      cur.ef = Math.min(cur.ef || 2.5, inc.ef);
      cur.ivl = Math.max(cur.ivl || 0, inc.ivl);
      cur.reps = Math.max(cur.reps || 0, inc.reps);
      if (inc.due && (!cur.due || inc.due < cur.due)) cur.due = inc.due;
    } else {
      st[f[0]] = inc;
    }
    n++;
  }
  save();
  return { n: n, merged: merged };
}

const $io = document.getElementById("io");

function copyIO() {
  const t = document.getElementById("ioText");
  t.focus(); t.select();
  try { t.setSelectionRange(0, 999999); } catch (e) { /* ignore */ }
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  const hint = document.getElementById("ioHint");
  if (ok) { hint.textContent = "✅ 已复制到剪贴板，去粘贴保存吧"; return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(function () {
      hint.textContent = "✅ 已复制到剪贴板，去粘贴保存吧";
    }, function () {
      hint.textContent = "请长按上面的文字手动全选复制";
    });
    return;
  }
  hint.textContent = "请长按上面的文字手动全选复制";
}

function showExport() {
  document.getElementById("ioTitle").textContent = "导出进度";
  document.getElementById("ioHint").innerHTML =
    "下面这串码就是你全部的学习记录。<b>复制走存好</b>（微信收藏、备忘录、发给自己都行）。" +
    "换手机、手机丢了重装、或者哪天数据被清了，把它粘回「导入进度」就能恢复。";
  document.getElementById("ioText").value = exportText();
  const btn = document.getElementById("ioDo");
  btn.textContent = "复制";
  btn.onclick = copyIO;
  $io.classList.add("on");
}

function showImport() {
  document.getElementById("ioTitle").textContent = "导入进度";
  document.getElementById("ioHint").innerHTML =
    "把之前「导出进度」得到的那串码粘到下面，然后点导入。" +
    "已经做过的题会<b>合并</b>（取更保守的那个状态），不会覆盖你现在的进度。";
  document.getElementById("ioText").value = "";
  const btn = document.getElementById("ioDo");
  btn.textContent = "导入";
  btn.onclick = function () {
    const hint = document.getElementById("ioHint");
    try {
      const r = importText(document.getElementById("ioText").value);
      hint.textContent = "✅ 导入成功：读到 " + r.n + " 条记录" +
        (r.merged ? "，其中 " + r.merged + " 条和你现有的进度做了合并。" : "。");
      renderSheet();
    } catch (e) {
      hint.textContent = "❌ " + e.message;
    }
  };
  $io.classList.add("on");
}

document.getElementById("ioX").onclick = function () { $io.classList.remove("on"); };

function renderSheet() {
  // 板块
  const sp = document.getElementById("segParts");
  sp.innerHTML = PARTS.map(function (p) {
    const n = Q.filter(function (x) { return x.part === p; }).length;
    const on = cfg.parts.indexOf(p) >= 0;
    return '<button data-p="' + esc(p) + '" class="' + (on ? "on" : "") + '">' + esc(p) + " <small style='opacity:.6'>" + n + "</small></button>";
  }).join("");
  const btns = sp.querySelectorAll("button");
  for (let i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      const p = this.getAttribute("data-p");
      const k = cfg.parts.indexOf(p);
      if (k >= 0) { if (cfg.parts.length > 1) cfg.parts.splice(k, 1); }
      else cfg.parts.push(p);
      save(); renderSheet();
    };
  }
  // 范围 / 方式
  markSeg("segScope", cfg.scope);
  markSeg("segMode", cfg.mode);
  markSeg("segNew", cfg.newPerDay == null ? 20 : cfg.newPerDay);
  // 统计
  const total = Q.length;
  const m = Q.filter(function (x) { return mastered(x.id); }).length;
  const star = Q.filter(function (x) { return st[x.id] && st[x.id].star; }).length;
  const wrong = Q.filter(function (x) { return st[x.id] && st[x.id].bad > 0; }).length;
  const seen = Q.filter(function (x) { return st[x.id] && st[x.id].seen > 0; }).length;
  document.getElementById("bigstat").innerHTML =
    "<div><b>" + m + "</b><small>已掌握</small></div>" +
    "<div><b>" + seen + "</b><small>做过的</small></div>" +
    "<div><b>" + star + "</b><small>错题本</small></div>" +
    "<div><b>" + (stat.streak || 0) + "</b><small>连续天数</small></div>";
  document.getElementById("statBox").innerHTML = PARTS.map(function (p) {
    const all = Q.filter(function (x) { return x.part === p; });
    const ok = all.filter(function (x) { return mastered(x.id); }).length;
    const pc = all.length ? Math.round(ok / all.length * 100) : 0;
    return '<div class="line"><span>' + esc(p) + '</span><span class="track"><i style="width:' + pc + '%"></i></span><b>' + ok + "/" + all.length + "</b></div>";
  }).join("");
  document.getElementById("forecastBox").innerHTML =
    '<div class="slabel">最近 8 周（每格一天，颜色越深练得越多）</div>' + heatHTML() +
    '<div class="slabel">未来 7 天要复习的量</div>' + forecastHTML();
  document.getElementById("hintBox").innerHTML =
    "共 " + total + " 条题、" + Q.reduce(function (a, x) { return a + (x.answers ? x.answers.length : 0); }, 0) + " 个空。<br>" +
    "连对 2 次算「已掌握」；答错会自动进错题本，之后连对 2 次自动移出。<br>" +
    "做过的题：" + seen + " 条，累计答错 " + wrong + " 条。<br>" +
    "连续打卡 " + (stat.streak || 0) + " 天，最后一次练习：" + (stat.lastDay || "还没开始") + "。<br>" +
    '<span style="opacity:.5">版本 ' + APPVER + "</span>";
}

const SEGKEY = { segScope: "scope", segMode: "mode", segNew: "newPerDay" };

function markSeg(id, v) {
  const box = document.getElementById(id);
  if (!box) return;
  const btns = box.querySelectorAll("button");
  const key = SEGKEY[id] || "mode";
  for (let i = 0; i < btns.length; i++) {
    const on = String(btns[i].getAttribute("data-v")) === String(v);
    btns[i].className = on ? "on" : "";
    btns[i].onclick = function () {
      const raw = this.getAttribute("data-v");
      cfg[key] = (key === "newPerDay") ? parseInt(raw, 10) : raw;
      save(); renderSheet();
    };
  }
}

/* ============================================================
   手势：左右滑动切题
   ============================================================ */
let tx = 0, ty = 0, tt = 0;
document.addEventListener("touchstart", function (e) {
  if (e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
}, { passive: true });
document.addEventListener("touchend", function (e) {
  if (e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  const dt = Date.now() - tt;
  if (dt > 600 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  if (document.getElementById("sheet").classList.contains("on")) return;
  if (dx < 0) { goTo(idx + 1); }        // 左滑下一题
  else { goTo(idx - 1); }               // 右滑上一题
}, { passive: true });

/* ============================================================
   启动
   ============================================================ */
load();
const _q = new URLSearchParams(location.search);
if (_q.get("mode")) cfg.mode = _q.get("mode");
pool = buildPool();
if (_q.get("i")) idx = Math.max(0, Math.min(pool.length - 1, parseInt(_q.get("i"), 10) || 0));
goTo(idx);
if (_q.get("reveal") === "1" && pool.length) revealAll(pool[idx]);

// 离线缓存
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      // 每次打开都主动问一次服务器有没有新版，别等浏览器自己想起来
      reg.update().catch(function () { });
    }).catch(function () { });
    let hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadCtrl) return; // 首次安装不刷新，避免闪一下
      hadCtrl = false;
      location.reload();
    });
  });
}
