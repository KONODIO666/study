<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="政治抽问">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>背单词</title>
<style>
:root{
  --bg:#0f1115; --bg2:#15181f; --card:#1a1d24; --card2:#20242d;
  --line:#2a2f3a; --tx:#e8eaed; --tx2:#9aa0a6; --tx3:#6b7280;
  --red:#e0453a; --red2:#ff6b5e; --green:#34c759; --green2:#7ee2a8;
  --amber:#ff9f0a; --blue:#4a9eff;
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx); overflow-x:hidden;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--sat)}

/* ---------- 顶栏 ---------- */
header{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg);
}
.title{font-size:17px;font-weight:700;letter-spacing:.5px}
.title small{font-weight:400;color:var(--tx3);font-size:12px;margin-left:6px;letter-spacing:0}
.spacer{flex:1}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--tx);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;
}
.chip:active{background:var(--card2)}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:17px;display:flex;
  align-items:center;justify-content:center;
}
.iconbtn:active{background:var(--card2)}

/* ---------- 进度条 ---------- */
.bar{flex:0 0 auto;height:3px;background:var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));width:0;transition:width .25s}

/* ---------- 主区 ---------- */
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 16px;min-height:210px;
}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;color:var(--tx2);background:var(--card2);border-radius:7px;padding:3px 9px}
.tag.p1{color:#ffb4a8;background:rgba(224,69,58,.16)}
.tag.p2{color:#ffd9a0;background:rgba(255,159,10,.15)}
.tag.p3{color:#a8d5ff;background:rgba(74,158,255,.15)}
.tag.p4{color:#b8f0c9;background:rgba(52,199,89,.15)}
.tag.p5{color:#dcc4ff;background:rgba(150,110,255,.16)}
.num{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.stars{margin-left:auto;display:flex;gap:6px;align-items:center}
.star{font-size:16px;opacity:.35}
.star.on{opacity:1}

.stem{font-size:19px;line-height:1.85;letter-spacing:.2px;word-break:break-word}
.filled{color:var(--green2);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.opt{background:#232733;border:1.5px solid #333a47;color:var(--tx);border-radius:12px;padding:12px 10px;
  font-size:15px;line-height:1.45;font-family:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.985)}
.opt.right{background:rgba(52,199,89,.18);border-color:var(--green);color:var(--green2)}
.opt.wrong{background:rgba(224,69,58,.18);border-color:var(--red);color:#ff8a80}
.opt.dim{opacity:.45}
.opts.jd .opt{font-size:19px;font-weight:700;padding:22px 0;letter-spacing:1px}
.stem.rev{font-size:21px;font-weight:600;color:var(--green2)}
.blank{
  display:inline-block;width:4.6em;padding:1px 6px;margin:0 2px;text-align:center;
  border-bottom:2px solid var(--red);color:var(--red2);font-weight:700;
  border-radius:6px 6px 0 0;vertical-align:baseline;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.blank.on{
  display:inline;width:auto;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;
  border-bottom:none;padding:1px 3px;color:var(--green2);font-weight:700;
  background:rgba(52,199,89,.14);border-radius:4px;cursor:default;
}
.blank.hint{
  color:var(--amber);border-bottom-color:var(--amber);border-bottom-style:dashed;
  white-space:normal;overflow:visible;text-overflow:clip;cursor:pointer;
}
.plain-note{
  margin-top:14px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6;
  color:var(--tx2);background:var(--card2);border:1px dashed var(--line);
}
.reveal-tip{margin-top:14px;font-size:13px;color:var(--tx3);text-align:center}
.legend{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.legend b{
  font-weight:600;color:var(--green2);background:rgba(52,199,89,.1);
  border:1px solid rgba(52,199,89,.25);border-radius:8px;padding:2px 8px;font-size:13px;
}
.legend b i{color:var(--tx3);font-style:normal;font-size:11px;margin-right:4px}

/* ---------- 底部按钮 ---------- */
footer{
  flex:0 0 auto;padding:10px 14px calc(10px + var(--sab));
  border-top:1px solid var(--line);background:var(--bg);
  display:flex;gap:10px;align-items:center;
}
.btn{
  flex:1;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);font-size:16px;font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;color:#fff}
.btn.ok{background:rgba(52,199,89,.16);border-color:rgba(52,199,89,.4);color:var(--green2)}
.btn.no{background:rgba(224,69,58,.14);border-color:rgba(224,69,58,.38);color:#ffb4a8}
.btn.easy{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.42);color:#8ec5ff}
.btn small{display:block;font-size:10px;font-weight:400;opacity:.72;margin-top:1px;letter-spacing:.2px}
.btn.sm{flex:0 0 auto;width:64px;font-size:15px;font-weight:600;color:var(--tx2)}

/* ---------- 抽屉 / 面板 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:40;backdrop-filter:blur(2px);
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;overflow-y:auto;
  background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:14px 16px calc(20px + var(--sab));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.shd{
  position:sticky;top:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  margin:-14px -16px 6px;padding:14px 16px 10px;
  background:var(--bg2);border-radius:22px 22px 0 0;
}
.shd span{font-size:16px;font-weight:600;color:var(--tx)}
.shd button{
  border:none;background:rgba(255,255,255,.09);color:var(--tx);
  font-size:14px;font-weight:600;padding:7px 16px;border-radius:10px;
}
.shd button:active{background:rgba(255,255,255,.18);transform:scale(.97)}
.sheet h3{margin:6px 0 10px;font-size:15px;color:var(--tx2);font-weight:600}
.sheet h3:first-child{margin-top:0}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1 1 40%;min-height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx2);font-size:14px;font-weight:600;padding:6px 10px;
}
.seg button.on{background:rgba(224,69,58,.16);border-color:var(--red);color:#ffb4a8}
.seg button:active{transform:scale(.98)}
.rowbtns{display:flex;gap:10px;margin-top:6px}
.rowbtns .btn{height:46px;font-size:15px}

/* ---------- 统计 ---------- */
.stat{margin-top:4px}
.stat .line{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.stat .line span:first-child{flex:0 0 92px;color:var(--tx2)}
.stat .track{flex:1;height:8px;border-radius:4px;background:var(--card);overflow:hidden}
.stat .track>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));width:0}
.stat .line b{flex:0 0 62px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2);font-weight:600;font-size:13px}
.bigstat{display:flex;gap:10px;margin:8px 0 14px}
.bigstat div{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px;text-align:center;
}
.bigstat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.bigstat small{color:var(--tx3);font-size:12px}
.hint{font-size:12.5px;color:var(--tx3);line-height:1.7;margin-top:10px}
.daily{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(224,69,58,.16),rgba(150,110,255,.12));
  border:1px solid rgba(224,69,58,.35);border-radius:14px;
  padding:10px 13px;margin-bottom:12px;font-size:14px;
}
.daily.ok{background:rgba(52,199,89,.12);border-color:rgba(52,199,89,.35)}
.daily b{color:#ffb4a8;font-weight:700}
.daily .go{
  margin-left:auto;background:var(--red);color:#fff;border-radius:10px;
  padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;
}
.daily.ok .go{background:rgba(52,199,89,.9)}
.daily .dtag{
  background:rgba(255,255,255,.09);border-radius:7px;padding:2px 7px;
  font-size:12px;color:var(--tx2);white-space:nowrap;
}
.slabel{font-size:12.5px;color:var(--tx2);margin:14px 0 6px;letter-spacing:.3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06)}
.heat i.h1{background:rgba(224,69,58,.32)}
.heat i.h2{background:rgba(224,69,58,.56)}
.heat i.h3{background:rgba(224,69,58,.8)}
.heat i.h4{background:var(--red)}
.fc{display:flex;align-items:flex-end;gap:6px;height:96px;padding:6px 2px 0}
.fcb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.fcb b{font-size:11px;color:var(--tx2);line-height:1.3;font-weight:600}
.fcb i{display:block;width:100%;min-height:2px;background:linear-gradient(180deg,var(--red),#7a1a14);border-radius:4px 4px 0 0}
.fcb.today i{background:linear-gradient(180deg,#ff8a7a,var(--red))}
.fcb small{font-size:10px;color:var(--tx3);margin-top:4px;white-space:nowrap}
.dueline{
  margin-top:12px;padding-top:11px;border-top:1px dashed rgba(255,255,255,.09);
  font-size:12.5px;color:var(--tx2);display:flex;justify-content:space-between;gap:8px;
}
.dueline b{color:var(--amber);font-weight:600}
.dueline .st{color:var(--amber);letter-spacing:1px}
.stem.word{font-size:34px;font-weight:700;letter-spacing:.5px;color:var(--tx);line-height:1.3}
.spell{margin-top:18px}
.spell input{
  width:100%;box-sizing:border-box;background:#232733;border:1.5px solid #333a47;color:var(--tx);
  border-radius:12px;padding:14px;font-size:19px;font-family:inherit;outline:none;
}
.spell input:focus{border-color:var(--red)}
.spell input:disabled{opacity:.75}
.seg.wrap{grid-template-columns:1fr 1fr;flex-wrap:wrap}
.seg button .cnt{opacity:.55;font-size:11px;margin-left:3px}
.srow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);margin:5px 0}
.srow span{width:58px;flex:none}
.srow .track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.srow .track i{display:block;height:100%;background:var(--red)}
.srow b{width:50px;text-align:right;flex:none;color:var(--tx3);font-weight:500}
.empty{text-align:center;color:var(--tx3);padding:60px 20px;font-size:15px;line-height:1.9}
.io{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(0,0,0,.74);
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);
}
.io.on{display:flex;align-items:center;justify-content:center}
.iobox{
  width:100%;max-width:560px;max-height:100%;background:#1a1d24;border-radius:18px;
  padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid #262a33;
}
.iohd{display:flex;align-items:center;justify-content:space-between;flex:none}
.iohd b{font-size:16px}
.iohd button{
  background:rgba(255,255,255,.09);border:0;color:var(--tx);border-radius:9px;
  padding:6px 13px;font-size:13px;font-family:inherit;
}
.iohint{font-size:12.5px;color:var(--tx2);line-height:1.6;flex:none}
#ioText{
  flex:1;min-height:150px;max-height:50vh;width:100%;resize:none;box-sizing:border-box;
  background:#0c0e12;color:var(--tx);border:1px solid #262a33;border-radius:11px;padding:10px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">背单词<small id="hdrSub"></small></div>
    <div class="spacer"></div>
    <button class="chip" id="btnStar">☆</button>
    <button class="iconbtn" id="btnSet">⚙</button>
  </header>
  <div class="bar"><i id="barFill"></i></div>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<div class="mask" id="mask"></div>

<div class="sheet" id="sheet">
  <div class="shd">
    <span>设置</span>
    <button id="btnBack">返回</button>
  </div>
  <div class="grabber"></div>
  <h3>背哪些 Word List</h3>
  <div class="seg wrap" id="segParts"></div>
  <h3>抽哪一批</h3>
  <div class="seg" id="segScope">
    <button data-v="today">今日任务</button>
    <button data-v="all">全部随机</button>
    <button data-v="todo">只抽没掌握的</button>
    <button data-v="weak">只抽错过的</button>
    <button data-v="star">只抽错题本</button>
  </div>
  <h3>出题方式</h3>
  <div class="seg" id="segMode">
    <button data-v="en2cn">看英文选意思</button>
    <button data-v="cn2en">看中文选单词</button>
    <button data-v="spell">默写单词</button>
    <button data-v="mix">混合随机</button>
  </div>
  <h3>每天新背几个</h3>
  <div class="seg" id="segNew">
    <button data-v="20">20 个</button>
    <button data-v="30">30 个</button>
    <button data-v="50">50 个</button>
    <button data-v="999">不限</button>
  </div>
  <h3>我的进度</h3>
  <div class="bigstat" id="bigstat"></div>
  <div class="stat" id="statBox"></div>
  <div class="forecast" id="forecastBox"></div>
  <div class="rowbtns">
    <button class="btn sm" style="width:auto;flex:1" id="btnExport">导出进度</button>
    <button class="btn sm" style="width:auto;flex:1" id="btnImport">导入进度</button>
  </div>
  <div class="rowbtns">
    <button class="btn sm" style="width:auto;flex:1" id="btnReset">清空全部进度</button>
    <button class="btn primary" style="flex:2" id="btnClose">开始背</button>
  </div>
  <div class="hint" id="hintBox"></div>
</div>

<div class="io" id="io">
  <div class="iobox">
    <div class="iohd"><b id="ioTitle">导出进度</b><button id="ioX">关闭</button></div>
    <div class="iohint" id="ioHint"></div>
    <textarea id="ioText" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
    <div class="rowbtns">
      <button class="btn primary" style="flex:1" id="ioDo">复制</button>
    </div>
  </div>
</div>

  if (s.due == null) s.due = "";
  return s;

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

  if (!s || !s.due) return 0;
  const t = new Date(s.due + "T00:00:00");

}

function masteryStars(i) {
  const s = st[i];
  if (!s || !s.seen) return 0;
  const n = s.ivl || 1;
  if (n >= 21) return 5;
  if (n >= 10) return 4;
  if (n >= 3) return 3;
  if (n >= 2) return 2;
  return 1;
}
function starsHTML(n) {
  let s = "";
  for (let i = 0; i < 5; i++) s += (i < n ? "★" : "☆");
  return '<span class="stars">' + s + "</span>";
}

function dueLineHTML(q) {
  const s = S(q.id);
  const d = dueDelay(s);
  let left = "下次复习 " + (s.ivl || 0) + " 天后";
  if (d > 0) left = '<b class="overdue">已逾期 ' + d + " 天</b>";
  else if (s.ivl <= 1) left = "明天再考你";
  return '<div class="dueline">' + left + '<span class="spacer"></span>' + starsHTML(masteryStars(q.id)) + "</div>";
}

/* grade: 0=没记住 1=记住了 2=太简单 */
function srsUpdate(s, grade) {
  const base = s.ivl || 0;
  const delay = dueDelay(s);
  let next;
  if (grade === 0) {
    s.reps = 0;
    next = s.seen > 1 ? Math.max(1, Math.round(base * 0.2)) : 1;
    if (s.seen > 1) s.ef = Math.max(EF_MIN, s.ef - 0.2);
  } else {
    if (grade === 2) {
      next = base > 0 ? Math.round(base * s.ef * 1.3) : 3;
      s.ef = Math.min(3.0, s.ef + 0.1);
    } else {
      next = s.reps < SRS_STEPS.length ? SRS_STEPS[s.reps] : Math.round(base * s.ef);
      if (base === 0) next = 1;
    }
    s.reps++;
    if (delay > 0) next += Math.round(delay * 0.5);
    next = Math.max(next, base + 1);
  }
  next = Math.min(next, MAX_IVL);
  s.ivl = next;
  s.due = dayStr(next);
  s.seen = (s.seen || 0) + 1;
  s.lastDay = dayStr(0);
}

/* 猜「如果现在点这个按钮，下次什么时候再来」——不改真实状态 */
function ivlLabel(s, grade) {
  const t = { ivl: s.ivl || 0, ef: s.ef || 2.5, reps: s.reps || 0, seen: s.seen || 0, due: s.due || "" };
  srsUpdate(t, grade);
  return t.ivl + " 天后";
}

/* ============================================================
   日期 / 打卡
   ============================================================ */
function dayStr(off) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + (off || 0));
  const m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
}

function touchDay() {
  const today = dayStr(0);
  if (stat.lastDay === today) return;
  stat.streak = (stat.lastDay === dayStr(-1)) ? ((stat.streak || 0) + 1) : 1;
  stat.lastDay = today;
}

/* ============================================================
   今日任务
   ============================================================ */
function todayCount() {
  const cand = Q.filter(function (x) { return cfg.lists.indexOf(x.list) >= 0; });
  const due = cand.filter(function (x) { return dueToday(x.id) && !isNew(x.id); });
  const fresh = cand.filter(function (x) { return isNew(x.id); });
  const lim = (cfg.newPerDay == null ? 30 : cfg.newPerDay);
  const take = Math.min(fresh.length, lim);
  return { due: due.length, fresh: fresh.length, take: take, todo: due.length + take };
}

function dailyHTML() {
  const c = todayCount();
  const doneToday = stat.lastDay === dayStr(0);
  if (c.todo === 0) {
    return '<div class="daily ok"><span class="dtag">🎉 今天的量已经刷完了</span>' +
      (stat.streak > 1 ? '<span class="dtag">连续 ' + stat.streak + " 天</span>" : "") + "</div>";
  }
  const mins = Math.max(1, Math.round(c.todo * 14 / 60));
  return '<div class="daily' + (doneToday ? " ok" : "") + '">' +
    (doneToday ? "✅ 今天练过了" : "今日任务") + " · " +
    '<span class="dtag">复习 ' + c.due + "</span>" +
    '<span class="dtag">新词 ' + c.take + "</span>" +
    '<span class="dtag">约 ' + mins + " 分钟</span>" +
    (stat.streak > 1 ? '<span class="dtag">连续 ' + stat.streak + " 天</span>" : "") +
    '<span class="spacer"></span>' +
    '<button class="go" id="dGo">' + (doneToday ? "再练一组" : "开始 →") + "</button>" +
    "</div>";
}

function startTodo() {
  cfg.scope = "today";
  save();
  pool = buildPool();
  if (!pool.length) { renderEmpty(); return; }
  goTo(0);
}

/* ============================================================
   题池
   ============================================================ */
function buildTodo() {
  const cand = Q.filter(function (x) { return cfg.lists.indexOf(x.list) >= 0; });
  const due = shuffle(cand.filter(function (x) { return dueToday(x.id) && !isNew(x.id); }));
  const fresh = shuffle(cand.filter(function (x) { return isNew(x.id); }));
  const lim = (cfg.newPerDay == null ? 30 : cfg.newPerDay);
  return due.concat(fresh.slice(0, lim));
}

function buildPool() {
  if (cfg.scope === "today") return buildTodo();
  let arr = Q.filter(function (x) { return cfg.lists.indexOf(x.list) >= 0; });
  if (cfg.scope === "todo") arr = arr.filter(function (x) { return !mastered(x.id); });
  else if (cfg.scope === "weak") arr = arr.filter(function (x) { const s = st[x.id]; return s && s.bad > 0 && !mastered(x.id); });
  else if (cfg.scope === "star") arr = arr.filter(function (x) { const s = st[x.id]; return s && s.star; });
  return shuffle(arr.slice());
}

function pickMode(q) {
  if (cfg.mode !== "mix" && cfg.mode !== "spell") {
    // 指定了就按指定的来（英译中 / 中译英）
    return cfg.mode;
  }
  const s = st[q.id];
  const ok = (!s || !s.seen) ? 0 : (s.ok || 0);
  if (cfg.mode === "spell") return ok <= 2 ? "en2cn" : "spell";   // 还没熟先认脸，熟了再默写
  /* 混合：没见过的先做选择题，见过两次以上开始要求拼写 */
  if (ok <= 0) return Math.random() < 0.5 ? "en2cn" : "cn2en";
  if (ok <= 2) return Math.random() < 0.5 ? "cn2en" : "en2cn";
  return Math.random() < 0.6 ? "spell" : "cn2en";
}

/* ============================================================
   渲染
   ============================================================ */
const $main = document.getElementById("main");
const $foot = document.getElementById("footer");

function goTo(n) {
  if (!pool.length) { render(); return; }
  const len = pool.length;
  idx = ((n % len) + len) % len;
  answered = false;
  pickedOpt = null;
  spellDone = false;
  curMode = pickMode(pool[idx]);
  render();
}

function render() {
  if (!pool.length) { renderEmpty(); return; }
  if (idx >= pool.length) idx = 0;
  const q = pool[idx];
  if (curMode !== "en2cn" && curMode !== "cn2en" && curMode !== "spell") curMode = "en2cn";

  const total = pool.length;
  document.getElementById("barFill").style.width = ((idx + 1) / total * 100) + "%";
  document.getElementById("hdrSub").textContent = (idx + 1) + "/" + total + " · " + scopeName();
  document.getElementById("btnStar").textContent = S(q.id).star ? "★" : "☆";
  document.getElementById("btnStar").style.color = S(q.id).star ? "var(--amber)" : "var(--tx2)";

  const modeName = { en2cn: "选意思", cn2en: "选单词", spell: "默写" }[curMode];
  let body = "";
  body += '<div class="meta">';
  body += '<span class="tag">Word List ' + q.list + "</span>";
  body += '<span class="num">' + modeName + "</span>";
  body += "</div>";

  if (curMode === "en2cn") {
    body += '<div class="stem word">' + esc(q.word) + "</div>";
    if (answered) body += '<div class="legend" style="display:block">' + esc(q.cn) + "</div>";
    body += '<div class="opts" id="opts">' + optsHTML(q, "cn") + "</div>";
    body += '<div class="reveal-tip">' + (answered ? tipHTML(q) : "这个词是什么意思？") + "</div>";
  } else if (curMode === "cn2en") {
    body += '<div class="stem">' + esc(q.cnPlain || q.cn) + "</div>";
    if (answered) body += '<div class="legend" style="display:block">' + esc(q.word) + "</div>";
    body += '<div class="opts" id="opts">' + optsHTML(q, "word") + "</div>";
    body += '<div class="reveal-tip">' + (answered ? tipHTML(q) : "哪个单词是这个意思？") + "</div>";
  } else {
    body += '<div class="stem">' + esc(q.cnPlain || q.cn) + "</div>";
    body += '<div class="spell"><input id="spellIn" type="text" autocomplete="off" autocorrect="off" ' +
      'autocapitalize="off" spellcheck="false" placeholder="打出英文单词"></div>';
    if (answered) {
      body += '<div class="legend" style="display:block">' + esc(q.word) + "</div>";
      body += '<div class="reveal-tip">' + tipHTML(q) + "</div>";
    } else {
      body += '<div class="reveal-tip">凭记忆把这个单词打出来（大小写不挑）</div>';
    }
  }

  $main.innerHTML = dailyHTML() + '<div class="card">' + body +
    (answered ? dueLineHTML(q) : "") + "</div>";
  const dgo = document.getElementById("dGo");
  if (dgo) dgo.onclick = startTodo;
  bindOpts();
  if (curMode === "spell" && !answered) bindSpell();
  renderFooter(q);
}

function tipHTML(q) {
  if (curMode === "spell") {
    return spellDone ? "✅ 拼对了" : "❌ 拼错了 —— 正确写法见上面";
  }
  return pickedOpt === q[curMode === "en2cn" ? "cn" : "word"]
    ? "✅ 选对了" : "❌ 选错了，正确答案是上面绿色的那个";
}

function optsHTML(q, field) {
  const right = q[field];
  const opts = makeChoice(q, field);
  let h = "";
  for (let i = 0; i < opts.length; i++) {
    const t = opts[i];
    let cls = "opt";
    if (answered) {
      if (t === right) cls += " right";
      else if (t === pickedOpt) cls += " wrong";
      else cls += " dim";
    }
    h += '<button class="' + cls + '" data-opt="' + i + '">' + esc(t) + "</button>";
  }
  return h;
}

/* 干扰项：优先同一个 Word List 里的词（难度和形状都接近），不够再放宽到整本 */
function makeChoice(q, field) {
  const right = q[field];
  const used = {};
  used[right] = 1;
  const opts = [right];
  function take(poolArr, n) {
    const cand = shuffle(poolArr.filter(function (x) {
      const t = x[field];
      if (!t || used[t]) return false;
      if (Math.abs(t.length - right.length) > Math.max(5, Math.round(right.length * 0.7))) return false;
      used[t] = 1;
      return true;
    }));
    for (let i = 0; i < cand.length && opts.length < n; i++) opts.push(cand[i][field]);
  }
  take(Q.filter(function (x) { return x.list === q.list && x.id !== q.id; }), 4);
  if (opts.length < 4) take(Q.filter(function (x) { return x.id !== q.id; }), 4);
  return shuffle(opts);
}

function bindOpts() {
  const box = document.getElementById("opts");
  if (!box || answered) return;
  const btns = box.querySelectorAll(".opt");
  const q = pool[idx];
  const field = curMode === "en2cn" ? "cn" : "word";
  for (let i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      if (answered) return;
      pickedOpt = this.textContent;
      answered = true;
      applyMark(q, pickedOpt === q[field] ? 1 : 0);
      render();
    });
  }
}

function bindSpell() {
  const inp = document.getElementById("spellIn");
  if (!inp) return;
  const q = pool[idx];
  function submit() {
    if (answered) return;
    const v = inp.value.trim().toLowerCase();
    const right = q.word.toLowerCase();
    spellDone = (v === right);
    answered = true;
    inp.disabled = true;
    applyMark(q, spellDone ? 1 : 0);
    render();
  }
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  inp.addEventListener("blur", function () { setTimeout(function () { if (!answered) inp.focus(); }, 60); });
  setTimeout(function () { inp.focus(); }, 60);
  window.__spellSubmit = submit;
}

function renderFooter(q) {
  const s = S(q.id);

  if (!answered) {
    if (curMode === "spell") {
      $foot.innerHTML =
        '<button class="btn sm" id="bSkip">跳过</button>' +
        '<button class="btn primary" id="bShow">想不起来</button>';
      document.getElementById("bShow").onclick = function () { answered = true; spellDone = false; applyMark(q, 0); render(); };
      document.getElementById("bSkip").onclick = skip;
      return;
    }
    $foot.innerHTML =
      '<button class="btn sm" id="bSkip">跳过</button>' +
      '<button class="btn primary" id="bShow">不会，看答案</button>';
    document.getElementById("bShow").onclick = function () {
      pickedOpt = "\u0000";
      answered = true;
      applyMark(q, 0);
      render();
    };
    document.getElementById("bSkip").onclick = skip;
    return;
  }

  $foot.innerHTML =
    '<button class="btn no" id="bNo">没记住<small>' + ivlLabel(s, 0) + "</small></button>" +
    '<button class="btn ok" id="bOk">记住了<small>' + ivlLabel(s, 1) + "</small></button>" +
    '<button class="btn easy" id="bEasy">太简单<small>' + ivlLabel(s, 2) + "</small></button>" +
    '<button class="btn primary" id="bNext" style="flex:1.2">下一个 →</button>';
  document.getElementById("bNo").onclick = function () { mark(0); };
  document.getElementById("bOk").onclick = function () { mark(1); };
  document.getElementById("bEasy").onclick = function () { mark(2); };
  document.getElementById("bNext").onclick = next;
}

function renderEmpty() {
  $main.innerHTML = dailyHTML() +
    '<div class="empty">这一批里没有单词。<br>去设置里换个 Word List 或者放宽抽题范围吧。</div>';
  const dgo = document.getElementById("dGo");
  if (dgo) dgo.onclick = startTodo;
  $foot.innerHTML = "";
}

function scopeName() {
  const map = { today: "今日任务", all: "全部随机", todo: "没掌握的", weak: "错过的", star: "错题本" };
  return map[cfg.scope] || cfg.scope;
}

/* ============================================================
   统计：热力图 + 未来 7 天
   ============================================================ */
function heatHTML() {
  let h = '<div class="heat">';
  for (let i = -55; i <= 0; i++) {
    const d = dayStr(i);
    const n = (stat.history && stat.history[d]) || 0;
    let lv = "";
    if (n >= 50) lv = " h4";
    else if (n >= 25) lv = " h3";
    else if (n >= 10) lv = " h2";
    else if (n >= 1) lv = " h1";
    h += '<i class="' + lv.trim() + '" title="' + d + " · " + n + ' 个"></i>';
  }
  return h + "</div>";
}

function forecastHTML() {
  const days = [];
  for (let i = 0; i < 7; i++) days.push(dayStr(i));
  const cnt = days.map(function () { return 0; });
  Q.forEach(function (x) {
    const s = st[x.id];
    if (!s || !s.due) return;
    for (let i = 0; i < 7; i++) {
      if (i === 0 ? s.due <= days[0] : s.due === days[i]) { cnt[i]++; break; }
    }
  });
  const mx = Math.max(1, Math.max.apply(null, cnt));
  let h = '<div class="fc">';
  for (let i = 0; i < 7; i++) {
    const pct = Math.round(cnt[i] / mx * 100);
    h += '<div class="fcb' + (i === 0 ? " today" : "") + '">' +
      '<i style="height:' + Math.max(3, pct) + '%"></i>' +
      "<b>" + cnt[i] + "</b><small>" + (i === 0 ? "今天" : days[i].slice(5)) + "</small></div>";
  }
  return h + "</div>";
}

/* ============================================================
   评分
   ============================================================ */
function applyMark(q, grade) {
  const s = S(q.id);
  const good = grade > 0;
  touchDay();
  const today = dayStr(0);
  stat.history[today] = (stat.history[today] || 0) + 1;
  stat.done++;
  if (good) {
    stat.ok++;
    s.ok = Math.min(9, (s.ok || 0) + (grade === 2 ? 2 : 1));
    if (s.star && s.ok >= 2) s.star = false;
  } else {
    stat.bad++;
    s.ok = 0;
    s.bad = (s.bad || 0) + 1;
    s.star = true;
  }
  srsUpdate(s, grade);
  save();
}

function mark(grade) { applyMark(pool[idx], grade); next(); }
function skip() { next(); }

function next() {
  let n = idx + 1;
  if (n >= pool.length) {
    if (cfg.scope !== "all") { pool = buildPool(); n = 0; }
    else n = 0;
  }
  if (!pool.length) { renderEmpty(); return; }
  goTo(n);
}

/* ============================================================
   进度导出 / 导入
   ============================================================ */
const PROG_BASE = Date.UTC(2020, 0, 1);
const PROG_DAY = 86400000;

function cfgArr() { return cfg.parts || cfg.lists || []; }
function setCfgArr(v) { if (cfg.parts) cfg.parts = v; else cfg.lists = v; }

function exportText() {
  const L = [];
  L.push("ZZ1");
  L.push([stat.streak | 0, stat.lastDay || "", stat.done | 0, stat.ok | 0, stat.bad | 0].join(","));
  const H = stat.history || {};
  L.push(Object.keys(H).sort().map(function (k) { return k + ":" + H[k]; }).join(","));
  L.push([cfg.scope, cfg.mode, cfg.newPerDay == null ? "" : cfg.newPerDay].join(","));
  L.push(cfgArr().join("|"));
  Object.keys(st).forEach(function (id) {
    const s = st[id];
    if (!s || !s.seen) return;
    let d = 0;
    if (s.due) {
      const t = Date.parse(s.due + "T00:00:00Z");
      if (!isNaN(t)) d = Math.round((t - PROG_BASE) / PROG_DAY);
    }
    L.push([id, s.ok | 0, s.bad | 0, s.star ? 1 : 0, s.seen | 0,
            Math.round((s.ef || 2.5) * 10), s.ivl | 0, s.reps | 0, d].join(","));
  });
  return L.join("\n");
}

function importText(txt) {
  const lines = String(txt || "").replace(/\r/g, "").split("\n");
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (!lines[i] || lines[i].trim() !== "ZZ1") throw new Error("这串码不像本 App 导出的进度");
  i++;
  const a = (lines[i++] || "").split(",");
  stat.streak = parseInt(a[0], 10) || 0;
  stat.lastDay = a[1] || "";
  stat.done = parseInt(a[2], 10) || 0;
  stat.ok = parseInt(a[3], 10) || 0;
  stat.bad = parseInt(a[4], 10) || 0;
  stat.history = {};
  (lines[i++] || "").split(",").forEach(function (kv) {
    const p = kv.split(":");
    if (p.length === 2 && p[0]) stat.history[p[0]] = parseInt(p[1], 10) || 0;
  });
  const c = (lines[i++] || "").split(",");
  if (c[0]) cfg.scope = c[0];
  if (c[1]) cfg.mode = c[1];
  if (c[2]) cfg.newPerDay = parseInt(c[2], 10) || cfg.newPerDay;
  const ps = (lines[i++] || "").split("|").filter(Boolean);
  if (ps.length) setCfgArr(ps);
  let n = 0, merged = 0;
  for (; i < lines.length; i++) {
    const f = lines[i].split(",");
    if (f.length < 9 || !f[0]) continue;
    let due = "";
    const dd = parseInt(f[8], 10);
    if (dd > 0) due = new Date(PROG_BASE + dd * PROG_DAY).toISOString().slice(0, 10);
    const inc = {
      ok: parseInt(f[1], 10) || 0, bad: parseInt(f[2], 10) || 0,
      star: f[3] === "1", seen: parseInt(f[4], 10) || 0,
      ef: (parseInt(f[5], 10) || 25) / 10, ivl: parseInt(f[6], 10) || 0,
      reps: parseInt(f[7], 10) || 0, due: due
    };
    const cur = st[f[0]];
    if (cur && cur.seen) {
      merged++;
      cur.ok = Math.max(cur.ok || 0, inc.ok);
      cur.bad = (cur.bad || 0) + inc.bad;
      cur.star = !!(cur.star || inc.star);
      cur.seen = Math.max(cur.seen || 0, inc.seen);
      cur.ef = Math.min(cur.ef || 2.5, inc.ef);
      cur.ivl = Math.max(cur.ivl || 0, inc.ivl);
      cur.reps = Math.max(cur.reps || 0, inc.reps);
      if (inc.due && (!cur.due || inc.due < cur.due)) cur.due = inc.due;
    } else {
      st[f[0]] = inc;
    }
    n++;
  }
  save();
  return { n: n, merged: merged };
}

const $io = document.getElementById("io");

function copyIO() {
  const t = document.getElementById("ioText");
  t.focus(); t.select();
  try { t.setSelectionRange(0, 999999); } catch (e) { /* ignore */ }
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  const hint = document.getElementById("ioHint");
  if (ok) { hint.textContent = "✅ 已复制到剪贴板，去粘贴保存吧"; return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(function () {
      hint.textContent = "✅ 已复制到剪贴板，去粘贴保存吧";
    }, function () {
      hint.textContent = "请长按上面的文字手动全选复制";
    });
    return;
  }
  hint.textContent = "请长按上面的文字手动全选复制";
}

function showExport() {
  document.getElementById("ioTitle").textContent = "导出进度";
  document.getElementById("ioHint").innerHTML =
    "下面这串码就是你全部的学习记录。<b>复制走存好</b>（微信收藏、备忘录、发给自己都行）。" +
    "换手机、手机丢了重装、或者哪天数据被清了，把它粘回「导入进度」就能恢复。";
  document.getElementById("ioText").value = exportText();
  const btn = document.getElementById("ioDo");
  btn.textContent = "复制";
  btn.onclick = copyIO;
  $io.classList.add("on");
}

function showImport() {
  document.getElementById("ioTitle").textContent = "导入进度";
  document.getElementById("ioHint").innerHTML =
    "把之前「导出进度」得到的那串码粘到下面，然后点导入。" +
    "已经做过的题会<b>合并</b>（取更保守的那个状态），不会覆盖你现在的进度。";
  document.getElementById("ioText").value = "";
  const btn = document.getElementById("ioDo");
  btn.textContent = "导入";
  btn.onclick = function () {
    const hint = document.getElementById("ioHint");
    try {
      const r = importText(document.getElementById("ioText").value);
      hint.textContent = "✅ 导入成功：读到 " + r.n + " 条记录" +
        (r.merged ? "，其中 " + r.merged + " 条和你现有的进度做了合并。" : "。");
      renderSheet();
    } catch (e) {
      hint.textContent = "❌ " + e.message;
    }
  };
  $io.classList.add("on");
}

document.getElementById("ioX").onclick = function () { $io.classList.remove("on"); };

function renderSheet() {
  const box = document.getElementById("segParts");
  let h = "";
  LISTNOS.forEach(function (n) {
    h += '<button data-v="' + n + '" class="' + (cfg.lists.indexOf(n) >= 0 ? "on" : "") + '">' +
      "List " + n + ' <span class="cnt">' + LISTS[n] + "</span></button>";
  });
  box.innerHTML = h;
  box.className = "seg wrap";
  markSeg("segParts", null, true);
  markSeg("segScope", cfg.scope);
  markSeg("segMode", cfg.mode);
  markSeg("segNew", cfg.newPerDay == null ? 30 : cfg.newPerDay);

  const hit = Q.filter(function (x) { return cfg.lists.indexOf(x.list) >= 0; });
  const seen = hit.filter(function (x) { return !isNew(x.id); }).length;
  const mas = hit.filter(function (x) { return mastered(x.id); }).length;
  const star = hit.filter(function (x) { const s = st[x.id]; return s && s.star; }).length;
  document.getElementById("bigstat").innerHTML =
    "<div><b>" + mas + "</b><small>已掌握</small></div>" +
    "<div><b>" + seen + "</b><small>学过的</small></div>" +
    "<div><b>" + star + "</b><small>错题本</small></div>" +
    "<div><b>" + (stat.streak || 0) + "</b><small>连续天数</small></div>";

  const byList = {};
  hit.forEach(function (x) { byList[x.list] = (byList[x.list] || 0) + (mastered(x.id) ? 1 : 0); });
  let sb = "";
  LISTNOS.forEach(function (n) {
    const tot = LISTS[n];
    if (cfg.lists.indexOf(n) < 0) return;
    const got = byList[n] || 0;
    sb += '<div class="srow"><span>List ' + n + "</span>" +
      '<div class="track"><i style="width:' + Math.round(got / tot * 100) + '%"></i></div>' +
      "<b>" + got + "/" + tot + "</b></div>";
  });
  document.getElementById("statBox").innerHTML = sb;

  document.getElementById("forecastBox").innerHTML =
    '<div class="slabel">最近 8 周（每格一天，颜色越深背得越多）</div>' + heatHTML() +
    '<div class="slabel">未来 7 天要复习的量</div>' + forecastHTML();

  document.getElementById("hintBox").innerHTML =
    "共 " + Q.length + " 个单词，分 " + LISTNOS.length + " 个 Word List。<br>" +
    "选「默写」时是手打英文，大小写不挑。<br>" +
    "连对 2 次算掌握；答错自动进错题本。<br>" +
    '<span style="opacity:.5">版本 ' + APPVER + "</span>";
}

const SEGKEY = { segScope: "scope", segMode: "mode", segNew: "newPerDay" };
function markSeg(id, v, multi) {
  const box = document.getElementById(id);
  if (!box) return;
  const btns = box.querySelectorAll("button");
  for (let i = 0; i < btns.length; i++) {
    if (multi) {
      const n = parseInt(btns[i].getAttribute("data-v"), 10);
      btns[i].classList.toggle("on", cfg.lists.indexOf(n) >= 0);
      btns[i].onclick = function () {
        const k = parseInt(this.getAttribute("data-v"), 10);
        const at = cfg.lists.indexOf(k);
        if (at >= 0) cfg.lists.splice(at, 1); else cfg.lists.push(k);
        if (!cfg.lists.length) cfg.lists.push(k);
        save();
        renderSheet();
      };
      continue;
    }
    const key = SEGKEY[id];
    const raw = btns[i].getAttribute("data-v");
    const val = (key === "newPerDay") ? parseInt(raw, 10) : raw;
    btns[i].classList.toggle("on", String(val) === String(v));
    btns[i].onclick = function () {
      cfg[key] = (key === "newPerDay") ? parseInt(this.getAttribute("data-v"), 10) : this.getAttribute("data-v");
      save();
      renderSheet();
    };
  }
}

/* ============================================================
   手势 / 启动
   ============================================================ */
let tx = 0, ty = 0, tt = 0;
document.addEventListener("touchstart", function (e) {
  if (e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now();
}, { passive: true });
document.addEventListener("touchend", function (e) {
  if (e.touches.length || !pool.length) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Date.now() - tt > 700) return;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) goTo(idx + (dx < 0 ? 1 : -1));
}, { passive: true });

document.getElementById("btnSet").onclick = openSheet;
document.getElementById("btnBack").onclick = closeSheet;
document.getElementById("mask").onclick = closeSheet;
document.getElementById("btnClose").onclick = closeSheet;
document.getElementById("btnReset").onclick = function () {
  if (!confirm("清空全部背词进度？这个不能撤销。")) return;
  st = {};
  stat = { done: 0, ok: 0, bad: 0, lastDay: "", streak: 0, history: {} };
  save();
  renderSheet();
};
document.getElementById("btnExport").onclick = showExport;
document.getElementById("btnImport").onclick = showImport;
document.getElementById("btnStar").onclick = function () {
  if (!pool.length) return;
  const s = S(pool[idx].id);
  s.star = !s.star;
  save();
  render();
};

load();
const _q = new URLSearchParams(location.search);
if (_q.get("mode")) cfg.mode = _q.get("mode");
if (_q.get("list")) cfg.lists = [parseInt(_q.get("list"), 10)];
pool = buildPool();
if (_q.get("i")) idx = Math.max(0, Math.min(pool.length - 1, parseInt(_q.get("i"), 10) || 0));
goTo(idx);

// 离线缓存
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.update().catch(function () { });
    }).catch(function () { });
    let hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadCtrl) return;
      hadCtrl = false;
      location.reload();
    });
  });
}

</script>
